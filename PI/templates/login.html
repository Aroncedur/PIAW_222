<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>

<body>
    <div>
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
            <legend class="fieldset-legend">🧠PsicoCitas</legend>
            
            <label class="label">Gestiona tus citas con tu psicólogo</label>

            <div></div>

            <label class="label">Correo Electronico</label>
            <input type="email" class="input" placeholder="Correo Electronico" />

            <label class="label">Contraseña</label>
            <input type="password" class="input" placeholder="Contraseña" />

            <label class="label-text text-success">¿Olvidaste tu contraseña?</label>
            <button class="btn btn-success mt-4">Iniciar Sesión</button>
            <label>¿No tienes cuenta? Regístrate</label>
            <label class="label">Al registrarte aceptas los términos del servicio</label>
        </fieldset>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</html>
