<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center">
    <div class="card bg-base-100 w-96 shadow-sm">
        <div class="card-body">

            <h1 class="text-2xl font-bold text-success text-center">🧠 PsicoCitas</h1>
            <p class="text-center text-sm text-gray-500">Cuéntanos un poco sobre ti</p>

            <ul class="steps w-full my-4">
                <li class="step step-success" data-content="✓">Cuenta</li>
                <li class="step step-success">Tus datos</li>
                <li class="step">Listo</li>
            </ul>

            <fieldset class="fieldset">
                <label class="label">Teléfono</label>
                <input type="tel" class="input w-full" value="442 123 4567" />

                <label class="label">Fecha de nacimiento</label>
                <input type="date" class="input w-full" />

                <label class="label">Contacto de emergencia (opcional)</label>
                <input type="text" class="input w-full" placeholder="Nombre y teléfono" />
            </fieldset>

            <label class="label mt-4">
                <input type="checkbox" class="checkbox checkbox-success checkbox-sm" checked />
                Acepto los términos y el aviso de privacidad
            </label>

            <div class="flex gap-2 mt-4">
                <button class="btn btn-outline">Atrás</button>
                <button class="btn btn-success text-white flex-1">Crear cuenta</button>
            </div>

            <p class="text-center text-xs text-gray-500 mt-4">Tus datos solo los verá tu psicólogo</p>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</html>
