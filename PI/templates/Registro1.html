<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>

<body>
    <div>
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
            <legend class="fieldset-legend">🧠PsicoCitas</legend>

            <label class="label">Crea tu cuenta</label>

            <ul class="steps w-full">
                <li class="step step-success">Cuenta</li>
                <li class="step">Tus datos</li>
                <li class="step">Listo</li>
            </ul>

            <label class="label">Nombre completo</label>
            <input type="text" class="input" placeholder="Nombre completo" />

            <label class="label">Correo Electronico</label>
            <input type="email" class="input" placeholder="Correo Electronico" />

            <label class="label">Contraseña</label>
            <input type="password" class="input" placeholder="Contraseña" />
            <p class="label">Mínimo 8 caracteres, con una letra y un número</p>

            <label class="label">Confirmar contraseña</label>
            <input type="password" class="input" placeholder="Confirmar contraseña" />

            <button class="btn btn-success mt-4">Continuar</button>
            <a href="/" class="label-text text-success text-center mt-2">¿Ya tienes cuenta? Inicia sesión</a>
        </fieldset>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</html>
